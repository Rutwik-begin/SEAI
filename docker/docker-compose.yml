services:

  triton-server:
    image: nvcr.io/nvidia/tritonserver:24.08-py3

    container_name: triton-server

    command: >
      tritonserver
      --model-repository=/models

    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"

    volumes:
      - ../deployment/model_repository:/models

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  flask-app:
    build:
      context: ..
      dockerfile: docker/Flask.Dockerfile

    container_name: flask-app

    ports:
      - "5000:5000"

    environment:
      - TRITON_URL=triton-server:8000

    env_file:
      - ../Flask/.env

    depends_on:
      - triton-server